# HTTP: ACME challenge and redirect to HTTPS.
server {
    listen 80;
    server_name 2popuga.kolyach.me;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: proxy requests to the bot container through the shared Docker network.
server {
    listen 443 ssl;
    server_name 2popuga.kolyach.me;

    ssl_certificate /etc/letsencrypt/live/2popuga.kolyach.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/2popuga.kolyach.me/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location / {
        resolver 127.0.0.11 ipv6=off valid=30s;
        set $bot_upstream http://2popuga-bot:3000;

        proxy_pass $bot_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
